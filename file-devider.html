<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Splitter Pro</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            background-color: #121212; 
            color: #ffffff;
            margin: 0; 
            padding: 20px;
            box-sizing: border-box;
        }
        .container { 
            background: #1e1e1e; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.6); 
            text-align: center; 
            max-width: 450px; 
            width: 100%; 
        }
        h2 {
            margin-top: 0;
            color: #ffffff;
        }
        .drop-zone {
            border: 2px dashed #555;
            border-radius: 8px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: #252525;
            margin-bottom: 20px;
        }
        .drop-zone.dragover {
            border-color: #007bff;
            background-color: rgba(0, 123, 255, 0.1);
        }
        .drop-zone p {
            margin: 0;
            color: #aaa;
            font-size: 14px;
        }
        .file-name {
            display: block;
            margin-top: 10px;
            color: #4caf50;
            font-weight: bold;
            word-break: break-all;
        }
        .mode-selector {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
            background: #252525;
            padding: 10px;
            border-radius: 6px;
        }
        .mode-selector label {
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        input[type="number"] { 
            width: 100%; 
            padding: 12px; 
            background-color: #2a2a2a;
            border: 1px solid #444; 
            border-radius: 6px; 
            color: white;
            box-sizing: border-box;
            margin-bottom: 20px;
            font-size: 16px;
        }
        input[type="number"]:focus {
            outline: none;
            border-color: #007bff;
        }
        button { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            width: 100%;
            transition: background 0.3s;
        }
        button:hover { 
            background-color: #0056b3; 
        }
        button:disabled {
            background-color: #444;
            cursor: not-allowed;
            color: #888;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #007bff;
        }
        #downloadSection {
            margin-top: 25px;
            text-align: left;
            display: none;
            background: #252525;
            padding: 15px;
            border-radius: 8px;
        }
        #downloadSection h3 {
            margin-top: 0;
            font-size: 16px;
            border-bottom: 1px solid #444;
            padding-bottom: 10px;
        }
        #downloadList {
            list-style-type: none;
            padding: 0;
            margin: 0;
            max-height: 200px;
            overflow-y: auto;
        }
        #downloadList li {
            background: #1e1e1e;
            margin: 8px 0;
            padding: 10px;
            border-radius: 4px;
            border-left: 4px solid #4caf50;
            font-size: 14px;
            display: flex;
            align-items: center;
        }
        #downloadList li::before {
            content: "✓";
            color: #4caf50;
            margin-right: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>File Splitter Pro</h2>
        
        <div id="dropZone" class="drop-zone">
            <p id="dropText">Drag and drop a file here<br>or click to browse</p>
            <input type="file" id="fileInput" style="display: none;">
        </div>

        <div class="mode-selector">
            <label>
                <input type="radio" name="splitMode" value="parts" checked onchange="toggleMode()"> By Parts
            </label>
            <label>
                <input type="radio" name="splitMode" value="size" onchange="toggleMode()"> By Size (MB)
            </label>
        </div>

        <input type="number" id="numParts" placeholder="Number of parts (e.g., 5)" min="2" max="100">
        <input type="number" id="partSizeMB" placeholder="Size per part in MB (e.g., 10)" min="1" style="display: none;">
        
        <button id="splitBtn" onclick="splitFile()">Split & Download</button>
        <p id="status"></p>

        <div id="downloadSection">
            <h3>Downloads</h3>
            <ul id="downloadList"></ul>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const dropText = document.getElementById('dropText');
        let selectedFile = null;

        function toggleMode() {
            const mode = document.querySelector('input[name="splitMode"]:checked').value;
            if (mode === 'parts') {
                document.getElementById('numParts').style.display = 'block';
                document.getElementById('partSizeMB').style.display = 'none';
            } else {
                document.getElementById('numParts').style.display = 'none';
                document.getElementById('partSizeMB').style.display = 'block';
            }
        }

        // Click to upload
        dropZone.addEventListener('click', () => fileInput.click());

        // Handle file selection from input
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                selectedFile = e.target.files[0];
                updateDropZoneText();
            }
        });

        // Drag and Drop Events
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) {
                selectedFile = e.dataTransfer.files[0];
                fileInput.files = e.dataTransfer.files;
                updateDropZoneText();
            }
        });

        function updateDropZoneText() {
            dropText.innerHTML = `Selected File:<span class="file-name">${selectedFile.name}</span><br><span style="font-size: 12px; color: #888;">(${(selectedFile.size / (1024 * 1024)).toFixed(2)} MB)</span>`;
        }

        async function splitFile() {
            const status = document.getElementById('status');
            const downloadSection = document.getElementById('downloadSection');
            const downloadList = document.getElementById('downloadList');
            const splitBtn = document.getElementById('splitBtn');
            const mode = document.querySelector('input[name="splitMode"]:checked').value;

            if (!selectedFile) {
                alert("Please select or drag a file first!");
                return;
            }

            const fileSize = selectedFile.size;
            let numParts, partSize;

            if (mode === 'parts') {
                numParts = parseInt(document.getElementById('numParts').value);
                if (isNaN(numParts) || numParts < 2) {
                    alert("Please enter a valid number of parts (minimum 2).");
                    return;
                }
                partSize = Math.ceil(fileSize / numParts);
            } else {
                const sizeMB = parseFloat(document.getElementById('partSizeMB').value);
                if (isNaN(sizeMB) || sizeMB <= 0) {
                    alert("Please enter a valid size in MB.");
                    return;
                }
                partSize = Math.floor(sizeMB * 1024 * 1024);
                if (partSize >= fileSize) {
                    alert("Entered size is larger than or equal to the file size. Please enter a smaller size.");
                    return;
                }
                numParts = Math.ceil(fileSize / partSize);
            }
            
            const dotIndex = selectedFile.name.lastIndexOf('.');
            const name = dotIndex !== -1 ? selectedFile.name.substring(0, dotIndex) : selectedFile.name;
            const ext = dotIndex !== -1 ? selectedFile.name.substring(dotIndex) : '';

            splitBtn.disabled = true;
            downloadList.innerHTML = '';
            downloadSection.style.display = 'block';
            status.style.color = '#007bff';
            status.innerText = `Processing started... (${numParts} parts)`;

            for (let i = 0; i < numParts; i++) {
                const start = i * partSize;
                const end = Math.min(start + partSize, fileSize);
                
                const blob = selectedFile.slice(start, end);
                const partFileName = `${name}_part${i + 1}${ext}`;
                
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = partFileName;
                document.body.appendChild(a);
                a.click();
                
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                const li = document.createElement('li');
                li.innerText = `${partFileName} downloaded`;
                downloadList.appendChild(li);
                downloadList.scrollTop = downloadList.scrollHeight;

                // Thoda delay taki browser achanak se block na kare
                await new Promise(resolve => setTimeout(resolve, 800));
            }
            
            status.style.color = '#4caf50';
            status.innerText = "Success! All parts have been downloaded.";
            splitBtn.disabled = false;
        }
    </script>
</body>
</html>
