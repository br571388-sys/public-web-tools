<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Secure Website</title>
</head>
<body>
    <!-- Shuru mein bas loading dikhega -->
    <div id="content">Loading website...</div>

    <script>
        // Apna Cloudflare Worker wala link yahan daalo
        const workerUrl = 'https://tumhara-app.username.workers.dev';

        fetch(workerUrl)
            .then(response => response.text())
            .then(htmlData => {
                // Cloudflare se HTML aate hi page par daal do
                document.getElementById('content').innerHTML = htmlData;
            })
            .catch(err => {
                document.getElementById('content').innerHTML = "Error loading site.";
            });
    </script>
</body>
</html>
